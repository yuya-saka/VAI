experiment:
  name: baseline-noplane
  output_dir: Unet/outputs/line_surface_3d

data:
  annotation_root: /mnt/nfs1/home/yamamoto-hiroto/research/VAI/data/dataset
  dense_root: /mnt/nfs1/home/yamamoto-hiroto/research/VAI/data/dataset_zprop
  group: ALL
  image_size: 224
  sigma: 4.0
  slab_size: 15
  min_labeled_slices: 3
  train_stride: 1
  inference_stride: 1
  n_folds: 5
  test_fold: 0
  random_seed: 42

model:
  features: [16, 32, 64, 128]
  dropout: 0.08
  use_vertebra_conditioning: true
  num_vertebra: 7

training:
  gpu_id: 0
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0002
  epochs: 150
  early_stopping_patience: 15
  lr_patience: 8
  lr_factor: 0.5
  grad_clip: 1.0
  num_workers: 8
  prefetch_factor: 1
  persistent_workers: true
  log_interval_steps: 10
  amp: true
  # plane.yamlと同じ基準にする（対照群としての比較を公平にするため）。
  # plane_combined_error_pxはplane.enabled=falseでも常に計算される
  # （fit_planeは学習とは独立に評価時点のheatmapへ常に適用されるため）
  selection_metric: plane_combined_error_px
  early_stopping_metric: val_loss_mse

augmentation:
  horizontal_flip: false
  horizontal_flip_prob: 0.1
  hflip_channel_swap: [3, 4, 1, 2]
  rotation: true
  rotation_limit: 25
  scale: true
  scale_limit: 0.05
  brightness_contrast: true
  brightness_limit: 0.1
  contrast_limit: 0.1
  gaussian_noise: false
  noise_var_limit: [10, 50]

# 平面制約なしの対照群。plane.yaml との差は loss.plane.enabled だけにする
loss:
  plane:
    enabled: false

evaluation:
  heatmap_threshold:
    mode: adaptive
    min: 0.10
    peak_ratio: 0.4
  blob_iou_threshold: 0.10
  line_extend_ratio: 1.0
  distance_bin_mm: 3.2
  voxel_spacing_mm: 0.4

wandb:
  enabled: false
  project: null
  run_name: null
