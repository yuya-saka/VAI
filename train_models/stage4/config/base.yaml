experiment:
  phase: "stage4"
  name: "stage4_mixed_v2"

data:
  dataset_dir: "data/rsna_data/fracture_dataset_blind"
  csv_path: "data/rsna_data/train.csv"
  region_labels_path: "data/rsna_data/fracture_region_labels_dicom.csv"
  folds_path: "data/rsna_data/stage4_folds.csv"
  excluded_studies_path: "data/rsna_data/excluded_studies.csv"
  excluded_levels_path: "data/rsna_data/excluded_levels.csv"
  stage_to_local: true
  stage_root: "/dev/shm"
  stage_workers: 32
  n_slices: 15
  in_channels: 6
  n_regions: 4
  n_folds: 5
  random_seed: 42
  start_fold: 0
  end_fold: 4

model:
  backbone: "tf_efficientnetv2_s"
  pretrained: true
  fpn_channels: 256
  region_hidden: 256
  region_layers: 2
  region_mode: "masked"
  slice_agg: "tied_attention"
  region_agg: "normalized_smoothmax"
  attention_temperature: 1.0
  slice_lse_temperature: 1.0
  region_temperature: 1.0
  scramble_seed: 42

training:
  n_gpu: 2
  gpu_ids: [1, 2]
  gpu_id: 1
  batch_size: 8
  strong_per_batch: 2
  weak_per_batch: 2
  negative_per_batch: 4
  backbone_learning_rate: 2.3e-4
  head_learning_rate: 2.3e-4
  eta_min: 2.3e-5
  weight_decay: 1.0e-4
  fixed_epochs: 75
  validation_interval_epochs: 1
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  p_mixup: 0.0
  p_rand_order: 0.0
  positive_weight: 2.0
  lambda_region_scale: 1.0
  lambda_neg: 0.05
  negative_sampler_seed: 42
  diagnostic_interval_steps: 100
  gradient_clip_norm: 1.0
  use_amp: true
  amp_dtype: "bfloat16"
  amp_initial_scale: 4096.0

augmentation:
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.0
  transpose_p: 0.0
  brightness_limit: 0.1
  brightness_p: 0.7
  shift_limit: 0.1
  scale_limit: 0.1
  rotate_limit: 10
  ssr_border_mode: 4
  ssr_p: 0.5
  blur_noise_p: 0.3
  distortion_p: 0.0
  cutout_p: 0.05
  cutout_ratio: 0.25

wandb:
  enabled: true
  project: null
  run_name: null
